<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mattslote.com</title>
<meta name="description" content="Personal app projects by Matt Slote.">
<style>
  :root {
    --bg: #fafaf7; --fg: #1a1a18; --muted: #6b6b64; --card: #ffffff;
    --line: #e4e3dc; --accent: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --fg: #ecebe6; --muted: #9a9990; --card: #1d1d1b; --line: #2e2e2b; --accent: #fb923c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 80px; }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); margin: 0 0 40px; }
  .grid { display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  .card h2 { margin: 0; font-size: 1.25rem; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .status { font-size: .8rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .summary { margin: 8px 0 12px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .tag { font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  details ul { margin: 8px 0 0; padding-left: 20px; }
  .meta { margin-top: 12px; font-size: .8rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
  a { color: var(--accent); }
  .empty, .error { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1 id="title">App Projects</h1>
  <p class="tagline" id="tagline"></p>
  <div class="grid" id="grid" aria-live="polite"><p class="empty">Loading…</p></div>
</main>
<script>
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  fetch('projects.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      document.getElementById('title').textContent = data.title || 'App Projects';
      document.getElementById('tagline').textContent = data.tagline || '';
      const grid = document.getElementById('grid');
      grid.replaceChildren();
      const list = (data.projects || []).slice().sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
      if (!list.length) { grid.append(el('p', 'empty', 'Nothing here yet.')); return; }
      for (const p of list) {
        const card = el('article', 'card');
        const row = el('div', 'row');
        row.append(el('h2', null, p.name), el('span', 'status', p.status || ''));
        card.append(row, el('p', 'summary', p.summary || ''));
        if (p.tags && p.tags.length) {
          const tags = el('div', 'tags');
          p.tags.forEach(t => tags.append(el('span', 'tag', t)));
          card.append(tags);
        }
        if (p.notes && p.notes.length) {
          const d = el('details');
          d.append(el('summary', null, 'Notes'));
          const ul = el('ul');
          p.notes.forEach(n => ul.append(el('li', null, n)));
          d.append(ul);
          card.append(d);
        }
        const meta = el('div', 'meta');
        if (p.updated) meta.append(el('span', null, 'Updated ' + p.updated));
        if (p.link && /^https?:\/\//.test(p.link)) {
          const a = el('a', null, 'Visit');
          a.href = p.link; a.rel = 'noopener';
          meta.append(a);
        }
        card.append(meta);
        grid.append(card);
      }
    })
    .catch(() => {
      document.getElementById('grid').replaceChildren(el('p', 'error', 'Could not load projects.'));
    });
</script>
</body>
</html>
