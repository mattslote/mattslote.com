<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matt Slote | App Projects</title>
<meta name="description" content="Personal app projects by Matt Slote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff; --surface: #eaeaee; --surface-2: #dcdce2; --line: #d6d6dc;
    --text: #111; --muted: #555a60; --accent: #1470af; --accent-ink: #fff; --sky: #8eb6dc;
    --radius: 10px; --max: 1160px;
    --sans: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 300 16px/1.7 var(--sans); }
  .wrap { max-width: var(--max); margin: 0 auto; padding: 0 16px; }
  a { color: var(--accent); }

  .site-header { padding: 56px 0 0; }
  .site-header h1 { font-size: 2rem; line-height: 1.15; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 8px; }
  .site-header p { margin: 0; color: var(--muted); }

  main.wrap { padding-top: 40px; padding-bottom: 80px; }
  h2.section { font-size: 2rem; line-height: 1.15; font-weight: 500; letter-spacing: -0.01em; margin: 0 0 32px; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .head .row { flex: 1; margin-bottom: 0; }
  .logo { width: 48px; height: 48px; object-fit: contain; flex: none; }
  .card h3 { margin: 0; font-size: 1.25rem; line-height: 1.15; font-weight: 500; letter-spacing: -0.01em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .status { font-size: .75rem; font-weight: 500; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 2px 10px; }
  .summary { margin: 0 0 16px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .tag { font-size: .75rem; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 2px 10px; color: var(--muted); }
  details { margin-bottom: 16px; }
  details summary { cursor: pointer; color: var(--muted); font-size: .95rem; font-weight: 400; }
  details ul { margin: 8px 0 0; padding-left: 20px; }
  .meta { margin-top: auto; font-size: .85rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-block; text-decoration: none; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 8px 14px; font-weight: 500; font-size: .9rem; }
  .btn:hover { filter: brightness(1.1); }
  .empty, .error { color: var(--muted); }

</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1 id="title">App Projects</h1>
    <p id="tagline"></p>
  </div>
</header>
<main class="wrap">
  <div class="grid" id="grid" aria-live="polite"><p class="empty">Loading…</p></div>
</main>
<script>
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  fetch('projects.json', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      document.getElementById('title').textContent = data.title || 'App Projects';
      document.getElementById('tagline').textContent = data.tagline || '';
      const grid = document.getElementById('grid');
      grid.replaceChildren();
      const list = (data.projects || []).slice().sort((a, b) => (b.updated || '').localeCompare(a.updated || ''));
      if (!list.length) { grid.append(el('p', 'empty', 'Nothing here yet.')); return; }
      for (const p of list) {
        const card = el('article', 'card');
        const row = el('div', 'row');
        row.append(el('h3', null, p.name));
        if (p.status) row.append(el('span', 'status', p.status));
        const head = el('div', 'head');
        if (p.logo) {
          const img = el('img', 'logo');
          img.src = p.logo; img.alt = ''; img.loading = 'lazy';
          img.onerror = () => img.remove();
          head.append(img);
        }
        head.append(row);
        card.append(head, el('p', 'summary', p.summary || ''));
        if (p.tags && p.tags.length) {
          const tags = el('div', 'tags');
          p.tags.forEach(t => tags.append(el('span', 'tag', t)));
          card.append(tags);
        }
        if (p.notes && p.notes.length) {
          const d = el('details');
          d.append(el('summary', null, 'Notes'));
          const ul = el('ul');
          p.notes.forEach(n => ul.append(el('li', null, n)));
          d.append(ul);
          card.append(d);
        }
        const meta = el('div', 'meta');
        if (p.updated) meta.append(el('span', null, 'Updated ' + p.updated));
        if (p.link && /^https?:\/\//.test(p.link)) {
          const a = el('a', 'btn', 'Visit');
          a.href = p.link; a.rel = 'noopener';
          meta.append(a);
        }
        card.append(meta);
        grid.append(card);
      }
    })
    .catch(() => {
      document.getElementById('grid').replaceChildren(el('p', 'error', 'Could not load projects.'));
    });
</script>
</body>
</html>
