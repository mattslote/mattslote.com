/* Layout: HUD on top, a goal line, one portrait tank in an orange plastic case that scales to fit, one big push button, a slim control bar.

    c.globalAlpha = Math.max(0, 1 - f.t / .6); c.strokeStyle = C.shell; c.lineWidth = 3;
    c.beginPath(); c.arc(f.x, f.y, 14 + f.t * 140, 0, 6.2832); c.stroke();
  }
  c.globalAlpha = 1;

  /* air gap and surface */
  c.fillStyle = '#f4e6c3'; c.fillRect(0, 0, W, SURF - 3);
  c.beginPath(); c.moveTo(0, SURF - 3);
  for (i = 0; i <= W; i += 12) c.lineTo(i, SURF - 3 + Math.sin(i / 38 + (reduce ? 0 : now / 600)) * 2.2);
  c.lineTo(W, 0); c.lineTo(0, 0); c.closePath(); c.fill();
  c.fillStyle = '#3a2112'; c.globalAlpha = .85; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  c.font = '700 11px ' + BODY;
  if ('letterSpacing' in c) c.letterSpacing = '3px';
  c.fillText(LEVELS[li].name.toUpperCase(), W / 2, 12);
  if ('letterSpacing' in c) c.letterSpacing = '0px';
  c.globalAlpha = 1;

  if (hintOn && st === 'ready' && li === 0) {
    c.textAlign = 'center'; c.lineJoin = 'round';
    c.font = '400 36px ' + DISPLAY;
    c.strokeStyle = 'rgba(58,33,18,.75)'; c.lineWidth = 7; c.fillStyle = '#f4e6c3';
    c.strokeText('HOLD THE BUTTON', W / 2, 250); c.fillText('HOLD THE BUTTON', W / 2, 250);
    c.font = '700 17px ' + BODY; c.lineWidth = 5;
    var tip = 'Shoot the rings up, then drop them over a peg';
    c.strokeText(tip, W / 2, 278); c.fillText(tip, W / 2, 278);
  }
}

/* ---------- Loop ---------- */
function frame(now) {
  var dt = Math.min(.05, (now - last) / 1000 || 0), i;
  last = now; acc += dt;
  var live = st === 'ready' || st === 'play';
  var push = live && (held || keyHeld);
  if (st === 'menu') acc = 0;
  while (acc >= STEP) { stepWorld(w, STEP, push); acc -= STEP; }
  if (w.started && st === 'ready') st = 'play';
  while (w.ev.length) { var ev = w.ev.shift(); if (ev.type === 'latch') onLatch(ev); else if (ev.type === 'pop') onPop(ev); else if (ev.type === 'reject') { elGoal.textContent = 'Not a line. Rings released!'; toastT = 2.2; } }
  if (w.done && st === 'play') { st = 'scored'; doneTimer = 0; }

  if (w.jl > .1 && !reduce) {
    var n = Math.round(dt * 90 * w.jl + Math.random() * .6);
    for (var q = 0; q < n; q++) spawnBubble(CX + (Math.random() - .5) * 18, FLOORC - 8, (Math.random() - .5) * 90, -(260 + Math.random() * 260), 1.5 + Math.random() * 3);
  }
  for (i = bubbles.length - 1; i >= 0; i--) {
    var b = bubbles[i];
    b.ph += dt * 4; b.x += (b.vx + Math.sin(b.ph) * 14) * dt; b.y += b.vy * dt; b.vy *= 1 - .3 * dt; b.vx *= 1 - 1.2 * dt;
    if (b.y < SURF + 2) bubbles.splice(i, 1);
  }
  for (i = flashes.length - 1; i >= 0; i--) { flashes[i].t += dt; if (flashes[i].t > .6) flashes.splice(i, 1); }
  if (st === 'scored') { doneTimer += dt; if (doneTimer > 1.3) { st = 'overlay'; showComplete(); } }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) elGoal.textContent = LEVELS[li].goal || GOALS[LEVELS[li].mode]; }
  jetSound();
  syncHud(false);
  if (cv.width > 0) drawScene(now);
  requestAnimationFrame(frame);
}

w = createWorld(0); w.sfx = sfx;
resize();
syncHud(true);
showIntro();
requestAnimationFrame(function (t) { last = t; frame(t); });
})();
</script>
